@keyframes rise{to{transform:translateY(calc(-100vh - 60px)) translateX(var(--dx))}}
.fx{position:absolute;inset:0;pointer-events:none}
#pulse{background:radial-gradient(ellipse 40% 45% at 78% 82%,rgba(255,40,50,.5),rgba(255,40,50,0) 70%);mix-blend-mode:screen;animation:pulse 3.6s ease-in-out infinite alternate}
#fog{background:linear-gradient(90deg,rgba(120,180,170,0),rgba(120,180,170,.16) 30%,rgba(120,180,170,0) 60%,rgba(120,180,170,.12) 85%,rgba(120,180,170,0));background-size:200% 100%;bottom:0;top:45%;animation:fog 40s linear infinite;opacity:.8}
@keyframes pulse{from{opacity:.25}50%{opacity:.8}to{opacity:.4}}
@keyframes fog{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#back,#front,.b,#pulse,#fog{animation:none}}
  .paused, .paused * { animation-play-state: paused !important; }
</style>
</head>
<body>
<div class="world" id="w" aria-label="Final level background">
  <div class="layer" id="back"></div>
  <div class="layer" id="mid"></div>
  <div class="fx" id="fog"></div>
  <div class="fx" id="pulse"></div>
  <div class="layer" id="front"></div>
</div>
<script>
const w=document.getElementById('w');
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
  for(let i=0;i<26;i++){const b=document.createElement('i');b.className='b';const s=4+Math.random()*12;
    b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${(Math.random()-.5)*60}px;animation-duration:${8+Math.random()*10}s;animation-delay:-${Math.random()*14}s`;w.insertBefore(b,document.getElementById('front'))}
  const L={back:6,mid:14,front:26};
  addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5;for(const k in L)document.getElementById(k).style.transform=`translateX(${-x*L[k]}px)`});
}
</script>

<script>
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'PAUSE') {
    document.body.classList.add('paused');
  } else if (e.data && e.data.type === 'RESUME') {
    document.body.classList.remove('paused');
  }
});
</script>
</body>
</html>
