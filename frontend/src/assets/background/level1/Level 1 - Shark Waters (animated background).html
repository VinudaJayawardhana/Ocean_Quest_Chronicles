<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Level 1 - Shark Waters (animated background)</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#06203a;font-family:system-ui,Segoe UI,Arial,sans-serif}
svg.scene{position:fixed;inset:0;width:100%;height:100%;display:block}.sw,.swt,.flag,.tw,.jel,.cau,.pulse,.bob,.drift,.bub,.rays,.fl,.fr{transform-box:fill-box}
.sw{transform-origin:50% 100%;animation:sway var(--t,5s) ease-in-out var(--dl,0s) infinite alternate}
.swt{transform-origin:50% 0;animation:sway var(--t,5s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--a,3deg)*-1))}to{transform:rotate(var(--a,3deg))}}
.bub{animation:rise var(--t,10s) linear var(--dl,0s) infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}85%{opacity:.9}100%{transform:translate(var(--x,20px),-1000px);opacity:0}}
.fl{animation:swimL var(--t,60s) linear var(--dl,0s) infinite}.fr{animation:swimR var(--t,60s) linear var(--dl,0s) infinite}
@keyframes swimL{from{transform:translateX(2400px)}to{transform:translateX(-800px)}}@keyframes swimR{from{transform:translateX(-800px)}to{transform:translateX(2400px)}}
.bob{animation:bob 4s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(16px)}}
.rays{animation:rays 9s ease-in-out infinite alternate}@keyframes rays{from{transform:translateX(-50px);opacity:.7}to{transform:translateX(50px);opacity:1}}
.drift{animation:drift var(--t,20s) ease-in-out var(--dl,0s) infinite alternate}@keyframes drift{to{transform:translateX(var(--x,-30px))}}
.tw{animation:tw 2.4s ease-in-out var(--dl,0s) infinite}@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.4)}}
.pulse{animation:pulse 3s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.5}to{opacity:1}}
.flag{transform-origin:0 50%;animation:flag 1.8s ease-in-out infinite alternate}@keyframes flag{from{transform:skewY(-4deg) scaleX(1)}to{transform:skewY(5deg) scaleX(.93)}}
.jel{animation:jel 8s ease-in-out infinite alternate}@keyframes jel{0%{transform:translate(0,0) scale(1,1)}50%{transform:translate(40px,-60px) scale(1.06,.94)}100%{transform:translate(-30px,-130px) scale(.96,1.06)}}
.cau{animation:cau 6s ease-in-out infinite alternate}@keyframes cau{from{transform:translateX(-36px);opacity:.3}to{transform:translateX(36px);opacity:.65}}
.ui{display:none!important}
.chip{pointer-events:auto;background:rgba(6,32,58,.55);color:#f2fbfc;padding:8px 16px;border-radius:99px;font-size:13px;letter-spacing:.06em;backdrop-filter:blur(6px)}
button.chip{border:0;cursor:pointer;font:inherit;font-size:13px;letter-spacing:.06em}button.chip:focus-visible{outline:3px solid #fff;outline-offset:3px}
.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}.orb{animation:orb var(--t,12s) ease-in-out var(--dl,0s) infinite alternate}@keyframes orb{from{transform:translate(0,0)}to{transform:translate(var(--x,80px),var(--y,-30px))}}.flap{transform-origin:50% 0;animation:flap 1.6s ease-in-out var(--dl,0s) infinite alternate}@keyframes flap{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}.orb,.flap{transform-box:fill-box}</style></head><body>
